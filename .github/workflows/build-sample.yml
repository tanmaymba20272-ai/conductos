name: build-sample

# Build the fixed golden sample from the CFPB narratives archive and commit it.
# No models or API keys: downloads public exports, filters to large banks, seeded sample split tune/test.

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Comma-separated archive export zip URLs"
        default: "https://files.consumerfinance.gov/f/documents/CCDB_Export_20_July_2026.zip,https://files.consumerfinance.gov/f/documents/CCDB_Export_19_June_2026.zip,https://files.consumerfinance.gov/f/documents/CCDB_Export_18_May_2026.zip,https://files.consumerfinance.gov/f/documents/CCDB_Export_17_April_2026.zip"
      n:
        description: "Complaints to sample (half tune, half test)"
        default: "2000"
      seed:
        description: "Random seed (keep fixed for reproducibility)"
        default: "2026"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Build golden sample
        run: |
          args=""
          for u in $(echo "${{ github.event.inputs.urls }}" | tr ',' ' '); do args="$args --url $u"; done
          conductos build-sample $args --large-banks --n "${{ github.event.inputs.n }}" --seed "${{ github.event.inputs.seed }}"
      - name: Commit sample
        run: |
          git config user.name "conductos-harness"
          git config user.email "actions@users.noreply.github.com"
          git add data/golden/
          git commit -m "data: large-bank golden sample (tune/test split)" || echo "no changes"
          git push
