[project]
name = "conductos"
version = "0.1.0"
description = "Agentic conduct & financial-crime operations platform: System One (Jev) decisions, LLM agents, governed autonomy, continuous evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Tanmay Mohanta" }]
dependencies = [
    "typesafe-sdk>=0.7.2",
    "pydantic>=2.12",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
conductos = "conductos.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["conductos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
